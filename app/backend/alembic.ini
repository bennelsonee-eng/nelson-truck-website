[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Use the same DATABASE_URL from app config; we read it programmatically in env.py.

[post_write_hooks]
# Ruff format hook disabled for now (entrypoint resolution flaky on Windows venvs).
# Format new migrations manually with: ruff format migrations/versions/
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

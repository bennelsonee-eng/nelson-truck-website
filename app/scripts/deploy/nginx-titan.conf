# Titan Truck website — production nginx site (Sprint-2 SEO cutover, 2026-07-13).
#
# Serves the Vite production build (app/frontend/dist/) and proxies the API +
# backend-served SEO surfaces to the FastAPI backend on :8001. Bot user-agents
# are routed to the headless-Chrome prerenderer (:3001) so crawlers get rendered
# HTML; humans get the SPA. Tailscale Serve fronts this on :443.
#
# INSTALL (on titan-prod, as titan with passwordless sudo):
#   sudo cp app/scripts/deploy/nginx-titan.conf /etc/nginx/sites-available/titan
#   sudo ln -sf /etc/nginx/sites-available/titan /etc/nginx/sites-enabled/titan
#   sudo nginx -t && sudo systemctl reload nginx
#
# PERMISSIONS: nginx (www-data) must traverse /home/titan (mode 750). Add
# www-data to the `titan` group + restart:
#   sudo usermod -aG titan www-data && sudo systemctl restart nginx
#
# ROLLBACK: point Serve back at the still-running Vite dev server:
#   sudo tailscale serve --bg --https=443 http://localhost:5174

# Crawlers that should receive prerendered HTML instead of the empty SPA shell.
# (This map lives at http{} context — the sites-enabled include sits inside http.)
map $http_user_agent $titan_is_bot {
    default 0;
    "~*(googlebot|google-inspectiontool|bingbot|bingpreview|yandex|baiduspider|duckduckbot|slurp|sogou|exabot|facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|slack-imgproxy|telegrambot|discordbot|whatsapp|redditbot|applebot|petalbot|bytespider|gptbot|oai-searchbot|chatgpt-user|perplexitybot|claudebot|claude-web|anthropic-ai|amazonbot|pinterest)" 1;
}

server {
    listen 8080;
    server_name _;
    root /home/titan/titan-truck-website/app/frontend/dist;
    index index.html;

    # Backend API + StaticFiles (product imagery). Forward client headers so the
    # Cloudflare-Access assertion + real client IP reach the backend unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; }

    # SEO surfaces served by the backend seo router (not the SPA, never prerendered).
    location = /robots.txt { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; }
    location = /llms.txt { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; }
    location ~ ^/sitemap.*\.xml$ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; }

    # Content-hashed build assets — safe to cache hard, never prerendered.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; try_files $uri =404; }

    # SPA routes: humans get the shell; bots get prerendered HTML.
    # NOTE: try_files and `if` must not share a location (nginx "if is evil" —
    # try_files would always win), so the human branch uses `rewrite ... break`
    # to serve the shell. Two mutually-exclusive `if`s, each with its own content
    # handler, is the documented-working prerender recipe.
    location / {
        try_files $uri @handle;
    }
    location @handle {
        set $prerender 0;
        if ($titan_is_bot) { set $prerender 1; }

        # Bots -> prerenderer. Our own render fetch isn't in the bot map, so its
        # requests take the human branch below (no render loop).
        if ($prerender = 1) {
            rewrite ^ /http://localhost:8080$request_uri? break;
            proxy_pass http://127.0.0.1:3001;
        }
        # Humans -> the SPA shell (dist/index.html under the server root).
        if ($prerender = 0) {
            rewrite ^ /index.html break;
        }
    }
}

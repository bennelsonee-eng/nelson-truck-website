<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser / home-screen icons: the Nelson badge (launch audit 2026-09-22). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#B01F27" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
    <!-- Title + meta description are managed per-route by <Seo> via React 19's
         native document-metadata hoisting (see src/components/Seo.tsx). Do NOT
         hardcode a <title> or <meta name="description"> here — a static tag
         would duplicate React's and win querySelector, showing stale metadata.
         The SSR layer (plan 1.1) will emit the real per-route head server-side. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- No-JS fallback: shown only when JavaScript is disabled/blocked (e.g. some
         hardened government/enterprise environments). Guarantees the visitor can
         still identify us and reach us to place an order. Inline-styled because
         Tailwind classes used only here would be purged from the CSS build.
         Phone numbers match the header and footer. -->
    <noscript>
      <div style="max-width:640px;margin:0 auto;padding:48px 20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#1f2937;line-height:1.6">
        <h1 style="font-size:28px;font-weight:800;margin:0 0 4px">Nelson Truck Equipment</h1>
        <p style="color:#6b7280;margin:0 0 24px">Commercial truck &amp; van equipment, snow plows, and accessories — serving the Pacific Northwest since 1937.</p>
        <div style="border-left:4px solid #b91c1c;background:#fef2f2;padding:16px 20px;border-radius:6px;margin:0 0 24px">
          <strong>This site needs JavaScript for full browsing and ordering.</strong>
          It looks like JavaScript is turned off or blocked on your network. You can still reach us directly and we'll help you find the right part or place an order.
        </div>
        <h2 style="font-size:18px;font-weight:700;margin:0 0 8px">Contact us</h2>
        <ul style="margin:0 0 24px;padding-left:18px">
          <li>Email: <a href="mailto:sales@nelsontruck.com" style="color:#b91c1c">sales@nelsontruck.com</a></li>
          <li>Portland, OR: <a href="tel:+15035489300" style="color:#b91c1c">503-548-9300</a></li>
          <li>Kent, WA: <a href="tel:+12533953825" style="color:#b91c1c">253-395-3825</a></li>
        </ul>
        <p style="color:#6b7280;font-size:14px;margin:0">To use the full catalog, please enable JavaScript in your browser, or ask your IT department to allow scripts from this site.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
